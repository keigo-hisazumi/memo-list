name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

# 本番デプロイ（deploy.yml）と同じ group で直列化し、gh-pages への
# 同時 push による競合（pr-* プレビューの消失）を防ぐ。
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    permissions:
      contents: write
      pull-requests: write
    # Dependabot が起動したワークフローは GITHUB_TOKEN が読み取り専用になり、
    # gh-pages への push やコメント投稿ができないためスキップする
    if: >-
      github.event.action != 'closed'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with PR-specific base path
        env:
          VITE_BASE_PATH: /memo-list/pr-${{ github.event.number }}/
          # プレビューでは自己破棄する SW を生成し、本番 SW との競合や
          # プレビュー同士のキャッシュ混在を防ぐ
          VITE_DISABLE_PWA: 'true'
        run: npm run build

      - name: Deploy PR preview to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Post preview URL comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://keigo-hisazumi.github.io/memo-list/pr-${prNumber}/`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(previewUrl)}`;
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '## プレビュー環境 🚀',
              '',
              `| | |`,
              `|---|---|`,
              `| **プレビューURL** | [${previewUrl}](${previewUrl}) |`,
              `| **コミット** | \`${context.sha.slice(0, 7)}\` |`,
              `| **QRコード** | ![](${qrUrl}) |`,
              '',
              '*コードをプッシュするたびに自動更新されます。*',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    permissions:
      contents: write
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove preview directory from gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code origin gh-pages; then
            echo "gh-pages branch does not exist, skipping cleanup"
            exit 0
          fi

          git fetch origin gh-pages
          git checkout gh-pages

          if [ -d "pr-${{ github.event.number }}" ]; then
            git rm -rf "pr-${{ github.event.number }}"
            git commit -m "chore: remove PR #${{ github.event.number }} preview"
            git push origin gh-pages
          else
            echo "Preview directory pr-${{ github.event.number }} not found, skipping"
          fi
